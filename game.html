<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Phonics V16.1</title>
    <style>
        :root { --primary: #651caa; --bg: #f8fafc; --text: #1e293b; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; position: sticky; top: 0; background: white; z-index: 100; }
        .img-btn { height: 40px; cursor: pointer; }
        .heading-text { font-size: 1.3rem; font-weight: bold; color: #4b0082; }
        .coin-box { font-weight: bold; color: var(--primary); }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .menu-card { border: 2px solid #e2e8f0; border-radius: 20px; cursor: pointer; overflow: hidden; }
        .menu-card img { width: 100%; display: block; }
        .rec-btn { padding: 20px; width: 80%; margin: 20px auto; font-size: 1.2rem; background: var(--primary); color: white; border: none; border-radius: 50px; cursor: pointer; touch-action: manipulation; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="home-view">
        <div class="main-logo-container" onclick="window.location.reload()"><img src="images/title_logo_2.png" style="width:100%"></div>
        <div style="padding:10px 20px; font-weight:bold; color:#651caa;">金幣: <span id="coin-val">100</span></div>
        <div id="main-menu" class="menu-grid">正在載入課程...</div>
    </div>
    
    <div id="section-view" class="hidden">
        <div class="header">
            <img src="images/back_btn.png" class="img-btn" onclick="window.showView('home-view')">
            <div id="chapter-heading-text" class="heading-text"></div>
            <div class="coin-box">金幣: <span class="coin-val">100</span></div>
        </div>
        <div id="section-list" class="menu-grid"></div>
    </div>

    <div id="word-view" class="hidden">
        <div class="header">
            <img src="images/back_btn.png" class="img-btn" onclick="window.showView('section-view')">
            <div id="section-heading-text" class="heading-text"></div>
            <div class="coin-box">金幣: <span class="coin-val">100</span></div>
        </div>
        <div id="word-list" style="text-align:center; padding:20px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const db = getFirestore(initializeApp({ projectId: "phonics-b096f" }));
    const chapterNames = { ch1: "1 認識自己", ch2: "2 家居空間", ch3: "3 美食天地", ch4: "4 日常生活", ch5: "5 城鄉見聞", ch6: "6 樂在其中", ch7: "7 好好學習", ch8: "8 綠色地球" };
    let gameData = {}, currentChKey = "", coins = 100, recorder = null, stream = null;

    window.showView = (id) => { document.querySelectorAll('.app-container > div').forEach(d => d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); };
    
    window.route = (k) => {
        currentChKey = k;
        document.getElementById('chapter-heading-text').innerText = chapterNames[k];
        const list = document.getElementById('section-list');
        list.innerHTML = Object.keys(gameData[k].sections).sort().map(sk => {
            let skImg = 's' + sk.replace(/[^0-9]/g, '').padStart(2, '0');
            return `<div onclick="window.openSection('${sk}')"><img src="images/${k}_${skImg}.png" style="width:100%; border-radius:15px;"></div>`;
        }).join('');
        window.showView('section-view');
    };

    window.openSection = (sk) => {
        const sec = gameData[currentChKey].sections[sk];
        const words = (sec.words || []).slice(0, 5);
        let idx = 0;
        document.getElementById('section-heading-text').innerText = sec.name;
        window.showView('word-view');
        
        const render = () => {
            if(idx >= words.length) {
                coins += 100;
                document.querySelectorAll('.coin-val').forEach(el => el.innerText = coins);
                document.getElementById('word-list').innerHTML = `<h2>🎉 完成！</h2><button class="rec-btn" onclick="location.reload()">返回首頁</button>`;
                return;
            }
            const w = words[idx];
            document.getElementById('word-list').innerHTML = `
                <div style="font-size:3rem; margin:20px;">${w.parts.map(p => `<span style="color:blue">${p.t}</span>`).join('')}</div>
                <button id="rec-btn" class="rec-btn">按住錄音</button>
            `;
            const btn = document.getElementById('rec-btn');
            btn.addEventListener('pointerdown', async () => {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                recorder.start();
                btn.innerText = "錄音中...";
            });
            btn.addEventListener('pointerup', () => {
                if(recorder && recorder.state === "recording") {
                    recorder.stop();
                    stream.getTracks().forEach(t => t.stop());
                    idx++; render();
                }
            });
        };
        render();
    };

    async function loadData() {
        try {
            const snap = await getDoc(doc(db, "gameConfig", "content"));
            if (snap.exists()) {
                gameData = snap.data();
                document.getElementById('main-menu').innerHTML = Object.keys(chapterNames).map(k => 
                    `<div class="menu-card" onclick="window.route('${k}')"><img src="images/${k}.png"></div>`
                ).join('');
            }
        } catch (e) { document.getElementById('main-menu').innerText = "載入失敗，請檢查網路。"; }
    }
    loadData();
</script>
</body>
</html>
