<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Phonics V32.0</title>
    <style>
        :root { --primary: #651caa; --bg: #f8fafc; }
        body { margin: 0; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .header { padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; background: white; }
        .img-btn { height: 40px; cursor: pointer; }
        .top-bar { padding: 10px 20px; font-weight: bold; color: var(--primary); border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .menu-card { border: 2px solid #e2e8f0; border-radius: 20px; cursor: pointer; overflow: hidden; text-align: center; }
        .menu-card img { width: 100%; display: block; }
        .word-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 15px; }
        .word-item-grid { padding: 15px 5px; border: 1px solid #ddd; border-radius: 10px; text-align: center; cursor: pointer; font-size: 1.1rem; }
        .word-text { font-size: 3rem; font-weight: bold; text-align: center; margin: 30px 0; }
        .rec-btn { padding: 15px 40px; font-size: 1.2rem; background: var(--primary); color: white; border: none; border-radius: 50px; display: block; width: 80%; margin: 20px auto; transition: 0.2s; }
        .active { background: #dc2626 !important; }
        .nav-btn { padding: 10px 20px; background: #666; color: white; border: none; border-radius: 10px; margin: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="home-view">
        <div onclick="window.location.reload()"><img src="images/title_logo_2.png" style="width:100%"></div>
        <div class="top-bar" onclick="window.showView('collection-view')">
            <span>⭐ 我的收藏</span><span id="coin-display">金幣: 100</span>
        </div>
        <div class="menu-grid">
            <script>for(let i=1;i<=8;i++) document.write(`<div class="menu-card" onclick="window.loadList('ch${i}')"><img src="images/ch${i}.png"></div>`);</script>
        </div>
    </div>
    
    <div id="list-view" class="hidden">
        <div class="header"><img src="images/back_btn.png" height="40" onclick="window.showView('home-view')"></div>
        <div id="word-list-container" class="word-grid"></div>
    </div>

    <div id="collection-view" class="hidden">
        <div class="header"><img src="images/back_btn.png" height="40" onclick="window.showView('home-view')"><button onclick="window.showView('shop-view')">商店</button></div>
        <div style="padding:20px;">暫無收藏</div>
    </div>
    <div id="shop-view" class="hidden">
        <div class="header"><img src="images/back_btn.png" height="40" onclick="window.showView('collection-view')"></div>
        <div style="padding:40px; text-align:center;">暫無商品</div>
    </div>
    
    <div id="word-view" class="hidden">
        <div class="header"><img src="images/back_btn.png" height="40" onclick="window.showView('list-view')"></div>
        <div style="text-align:center; padding:20px;">
            <div id="display" class="word-text"></div>
            <button id="rec-btn" class="rec-btn">按住讀出單詞</button>
            <div id="feedback" style="font-size:3rem; height:50px;"></div>
            <div>
                <button class="nav-btn" onclick="window.changeWord(-1)">上一題</button>
                <button class="nav-btn" onclick="window.changeWord(1)">下一題</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    const db = getFirestore(initializeApp({ projectId: "phonics-b096f" }));
    let gameData = null, allWords = [], cur = 0, recognition;

    window.showView = (id) => { 
        document.querySelectorAll('.app-container > div').forEach(d => d.classList.add('hidden')); 
        document.getElementById(id).classList.remove('hidden'); 
    };

    window.loadList = async (k) => {
        if(!gameData) { const snap = await getDoc(doc(db, "gameConfig", "content")); gameData = snap.data(); }
        allWords = []; Object.values(gameData[k].sections).forEach(s => allWords.push(...(s.words || [])));
        allWords.sort((a, b) => a.q.localeCompare(b.q));
        document.getElementById('word-list-container').innerHTML = allWords.map((w, idx) => `<div class="word-item-grid" onclick="window.startPractice(${idx})">${w.q}</div>`).join('');
        window.showView('list-view');
    };

    window.renderPractice = () => {
        const w = allWords[cur];
        document.getElementById('display').innerHTML = w.parts.map(p => `<span style="color:${p.ty==2?'blue':p.ty==3?'orange':p.ty==4?'green':p.ty==5?'purple':'black'}">${p.t}</span>`).join('');
        document.getElementById('feedback').innerText = "";
        window.showView('word-view');
        speechSynthesis.speak(new SpeechSynthesisUtterance(w.q));
    };

    window.startPractice = (idx) => { cur = idx; window.renderPractice(); };
    window.changeWord = (delta) => { cur = Math.max(0, Math.min(allWords.length - 1, cur + delta)); window.renderPractice(); };

    const btn = document.getElementById('rec-btn');
    btn.onmousedown = btn.ontouchstart = (e) => {
        e.preventDefault();
        btn.classList.add('active');
        try {
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.start();
        } catch(err) { console.error("錄音啟動失敗", err); }
    };

    btn.onmouseup = btn.ontouchend = (e) => {
        e.preventDefault();
        btn.classList.remove('active');
        if(recognition) {
            recognition.onresult = (e) => {
                const spoken = e.results[0][0].transcript.toLowerCase();
                const target = allWords[cur].q.toLowerCase();
                if(target.length <= 3 || (spoken.length > 0 && spoken[0] === target[0])) {
                    document.getElementById('feedback').innerText = "✅";
                    setTimeout(() => window.changeWord(1), 500);
                } else {
                    document.getElementById('feedback').innerText = "❌";
                }
            };
            recognition.stop();
        }
    };
</script>
</body>
</html>
