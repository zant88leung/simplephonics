<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Phonics V17.6</title>
    <style>
        :root { --primary: #651caa; --bg: #f8fafc; }
        body { margin: 0; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .main-logo-container { width: 100%; line-height: 0; cursor: pointer; }
        .header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; background: white; }
        .img-btn { height: 40px; cursor: pointer; }
        .top-bar { display: flex; justify-content: space-between; padding: 10px 20px; font-weight: bold; color: var(--primary); border-bottom: 1px solid #eee; cursor: pointer; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .shop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; }
        
        .menu-card { border: 2px solid #e2e8f0; border-radius: 20px; cursor: pointer; overflow: hidden; text-align: center; }
        .menu-card img { width: 100%; display: block; vertical-align: bottom; }

        .mysterious { filter: brightness(0) contrast(0); }
        #zoom-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:100; }
        #zoom-overlay img { max-width: 90%; max-height: 90%; border-radius: 10px; }

        .c-1 { color: #000; } .c-2 { color: #007bff; } .c-3 { color: #ff8800; } .c-4 { color: #28a745; } .c-5 { color: #9333ea; }
        .u-line { box-shadow: 0 4px 0 0 currentColor; }
        .word-display-box { height: 100px; display: flex; justify-content: center; align-items: baseline; margin: 10px 20px 0 20px; }
        .word-text { font-size: 3rem; font-weight: bold; display: flex; align-items: baseline; }
        .word-translation { font-size: 1.6rem; color: #333; margin-top: 10px; font-weight: bold; }
        
        .rec-btn { padding: 20px 40px; font-size: 1.2rem; background: var(--primary); color: white; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .rec-btn.recording { background: #dc2626; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="zoom-overlay" onclick="this.style.display='none'"><img id="zoomed-img" src=""></div>

<div class="app-container">
    <div id="home-view">
        <div class="main-logo-container" onclick="window.location.reload()"><img src="images/title_logo_2.png" style="width:100%"></div>
        <div class="top-bar" onclick="window.showCollection()"><span>⭐ 我的收藏</span><span class="coin-display">金幣: 100</span></div>
        <div id="main-menu" class="menu-grid">
            <script>for(let i=1;i<=8;i++) document.write(`<div class="menu-card" onclick="window.route('ch${i}')"><img src="images/ch${i}.png"></div>`);</script>
        </div>
    </div>
    
    <div id="collection-view" class="hidden">
        <div class="header">
            <img src="images/back_btn.png" class="img-btn" onclick="window.showView('home-view')">
            <div style="font-weight:bold;">我的收藏</div>
            <div onclick="window.renderShop()" style="cursor:pointer; color:var(--primary);">禮品商店</div>
        </div>
        <div id="collection-list" class="shop-grid"></div>
    </div>

    <div id="shop-view" class="hidden">
        <div class="header">
            <img src="images/back_btn.png" class="img-btn" onclick="window.showCollection()">
            <div style="font-weight:bold;">禮品商店</div>
            <div class="coin-display">金幣: 100</div>
        </div>
        <div id="shop-items" class="shop-grid"></div>
    </div>

    <div id="section-view" class="hidden">
        <div class="header"><img src="images/back_btn.png" class="img-btn" onclick="window.showView('home-view')"><div id="chapter-heading-text"></div><div class="coin-display">金幣: 100</div></div>
        <div id="section-list" class="menu-grid"></div>
    </div>

    <div id="word-view" class="hidden">
        <div class="header"><img src="images/back_btn.png" class="img-btn" onclick="window.showView('section-view')"><div id="section-heading-text"></div><div class="coin-display">金幣: 100</div></div>
        <div id="word-list" style="text-align:center; padding:20px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const db = getFirestore(initializeApp({ projectId: "phonics-b096f" }));
    const chapterNames = { ch1: "1 認識自己", ch2: "2 家居空間", ch3: "3 美食天地", ch4: "4 日常生活", ch5: "5 城鄉見聞", ch6: "6 樂在其中", ch7: "7 好好學習", ch8: "8 綠色地球" };
    
    let gameData = null, currentChKey = "", coins = 100, isRecording = false, recorder = null, stream = null, audioContext = null, audioDetected = false;
    let collectedItems = [];
    const shopItems = [
        { id: 1, price: 50, img: "gift_001.png" },
        { id: 2, price: 80, img: "gift_002.png" },
        { id: 3, price: 100, img: "gift_003.png" }
    ];

    window.showView = (id) => { document.querySelectorAll('.app-container > div').forEach(d => d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); };
    window.updateUI = () => document.querySelectorAll('.coin-display').forEach(el => el.innerText = "金幣: " + coins);

    window.showCollection = () => {
        const list = document.getElementById('collection-list');
        list.innerHTML = collectedItems.length === 0 ? "<div style='padding:20px;'>暫時未有收藏。</div>" : 
            collectedItems.map(item => `<div class="menu-card" onclick="window.zoomImg('images/${item.img}')"><img src="images/${item.img}"></div>`).join('');
        window.showView('collection-view');
    };

    window.zoomImg = (src) => { document.getElementById('zoomed-img').src = src; document.getElementById('zoom-overlay').style.display = 'flex'; };

    window.renderShop = () => {
        const container = document.getElementById('shop-items');
        container.innerHTML = shopItems.map(item => {
            const isOwned = collectedItems.find(i => i.id === item.id);
            return `<div class="menu-card" onclick="window.buyItem(${item.id})">
                <img src="images/${item.img}" class="${isOwned ? '' : 'mysterious'}">
                <p style="font-size:0.7rem; margin:2px 0;">${item.price} 金幣</p>
            </div>`;
        }).join('');
        window.showView('shop-view');
    };

    window.buyItem = (id) => {
        const item = shopItems.find(i => i.id === id);
        if (collectedItems.find(i => i.id === item.id)) return;
        if (confirm("你確定要花 " + item.price + " 金幣購買這個禮品嗎？")) {
            if (coins >= item.price) { coins -= item.price; collectedItems.push(item); window.updateUI(); window.renderShop(); }
            else alert("金幣不足！");
        }
    };

    window.route = async (k) => { 
        currentChKey = k; 
        document.getElementById('chapter-heading-text').innerText = chapterNames[k];
        if(!gameData) { const snap = await getDoc(doc(db, "gameConfig", "content")); gameData = snap.data(); }
        document.getElementById('section-list').innerHTML = Object.keys(gameData[k].sections).sort().map(sk => 
            `<div onclick="window.openSection('${sk}')"><img src="images/${k}_s${sk.replace(/\D/g,'').padStart(2,'0')}.png" style="width:100%; border-radius:15px;"></div>`
        ).join(''); 
        window.showView('section-view'); 
    };

    window.openSection = (sk) => {
        const sec = gameData[currentChKey].sections[sk];
        const words = (sec.words || []).slice(0, 5);
        let idx = 0;
        document.getElementById('section-heading-text').innerText = sec.name;
        window.showView('word-view');
        const render = () => {
            if(idx >= words.length) { document.getElementById('word-list').innerHTML = `<h2>🎉 挑戰完成！</h2><p>獲得 100 金幣！</p><button class="rec-btn" onclick="location.reload()">返回首頁</button>`; return; }
            const w = words[idx];
            document.getElementById('word-list').innerHTML = `
                <div class="word-translation">${w.a}</div>
                <div class="word-display-box"><div class="word-text">${w.parts.map(p => `<span class="c-${p.ty || 1} ${(p.u === 1) ? 'u-line' : ''}">${p.t}</span>`).join('')}</div></div>
                <button id="rec-btn" class="rec-btn">按一下開始錄音</button>
                <p style="color:#666; margin-top:20px;">(${idx+1}/5)</p>
            `;
            const btn = document.getElementById('rec-btn');
            btn.onclick = async () => {
                if (!isRecording) {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        audioContext = new AudioContext();
                        const source = audioContext.createMediaStreamSource(stream);
                        const processor = audioContext.createScriptProcessor(1024, 1, 1);
                        source.connect(processor); processor.connect(audioContext.destination); audioDetected = false;
                        processor.onaudioprocess = (e) => { const d = e.inputBuffer.getChannelData(0); let s = 0; for(let i=0;i<d.length;i++) s+=Math.abs(d[i]); if(s/d.length>0.05) audioDetected=true; };
                        recorder = new MediaRecorder(stream); recorder.start(); isRecording = true;
                        btn.innerText = "錄音中... (請大聲說)"; btn.classList.add('recording');
                    } catch(e) { alert("請允許麥克風權限"); }
                } else {
                    recorder.stop(); stream.getTracks().forEach(t => t.stop()); audioContext.close(); isRecording = false;
                    if(audioDetected) { coins += 20; window.updateUI(); idx++; render(); }
                    else { alert("錄不到聲音喔！請再試一次。"); btn.innerText = "按一下開始錄音"; btn.classList.remove('recording'); }
                }
            };
        };
        render();
    };
</script>
</body>
</html>
