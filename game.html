<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Phonics V16.0</title>
    <style>
        :root { --primary: #651caa; --bg: #f8fafc; --text: #1e293b; --accent: #f59e0b; }
        body { margin: 0; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; position: sticky; top: 0; background: white; z-index: 100; min-height: 65px; }
        .back-area { width: 80px; display: flex; justify-content: flex-start; }
        .img-btn { height: 40px !important; width: auto !important; cursor: pointer; object-fit: contain; }
        .heading-area { flex: 1; display: flex; justify-content: center; align-items: center; text-align: center; }
        .heading-text { font-size: 1.3rem; font-weight: bold; color: #4b0082; line-height: 1.2; }
        
        /* 通用金幣樣式 */
        .coin-box { font-weight: bold; color: var(--primary); font-size: 1rem; }
        
        .main-logo-container { width: 100%; padding: 0; line-height: 0; cursor: pointer; }
        .main-logo { width: 100%; height: auto; display: block; }
        .top-bar { display: flex; justify-content: space-between; padding: 10px 20px; font-weight: bold; color: var(--primary); border-bottom: 1px solid #eee; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .menu-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 20px; cursor: pointer; overflow: hidden; }
        .menu-card img { width: 100%; height: auto; display: block; }
        .section-grid-double { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .btn-card-img { width: 100%; height: auto; display: block; border-radius: 15px; cursor: pointer; border: 1px solid #f1f5f9; }
        
        .rec-box { padding: 50px 20px; text-align: center; }
        .rec-btn { padding: 20px 40px; font-size: 1.2rem; background: var(--primary); color: white; border: none; border-radius: 50px; cursor: pointer; }
        .c-1 { color: #000; } .c-2 { color: #007bff; } .c-3 { color: #ff8800; } .c-4 { color: #28a745; } .c-5 { color: #9333ea; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="home-view">
        <div class="main-logo-container" onclick="window.location.reload()"><img src="images/title_logo_2.png" class="main-logo"></div>
        <div class="top-bar">
            <span>⭐ 我的收藏</span>
            <span class="coin-display">金幣: 100</span>
        </div>
        <div id="main-menu" class="menu-grid"></div>
    </div>
    
    <div id="section-view" class="hidden">
        <div class="header">
            <div class="back-area"><img src="images/back_btn.png" class="img-btn" onclick="window.showView('home-view')"></div>
            <div class="heading-area"><div id="chapter-heading-text" class="heading-text"></div></div>
            <div class="coin-box">金幣: 100</div>
        </div>
        <div id="section-list" class="section-grid-double"></div>
    </div>

    <div id="word-view" class="hidden">
        <div class="header">
            <div class="back-area"><img src="images/back_btn.png" class="img-btn" onclick="window.showView('section-view')"></div>
            <div class="heading-area"><div id="section-heading-text" class="heading-text"></div></div>
            <div class="coin-box">金幣: 100</div>
        </div>
        <div id="word-list"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    const db = getFirestore(initializeApp({ projectId: "phonics-b096f" }));
    
    const chapterNames = { ch1: "1 認識自己", ch2: "2 家居空間", ch3: "3 美食天地", ch4: "4 日常生活", ch5: "5 城鄉見聞", ch6: "6 樂在其中", ch7: "7 好好學習", ch8: "8 綠色地球" };
    let gameData = {}, currentChKey = "", coins = 100;

    window.showView = (id) => { document.querySelectorAll('.app-container > div').forEach(d => d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); };
    window.route = (k) => { currentChKey = k; renderChapterList(k); };

    function renderChapterList(k) {
        document.getElementById('chapter-heading-text').innerText = chapterNames[k];
        document.getElementById('section-list').innerHTML = Object.keys(gameData[k].sections).sort().map(sk => {
            let skImg = 's' + sk.replace(/[^0-9]/g, '').padStart(2, '0');
            return `<div onclick="window.openSection('${sk}')"><img src="images/${k}_${skImg}.png" class="btn-card-img"></div>`;
        }).join('');
        window.showView('section-view');
    }

    window.openSection = (sk) => {
        const sec = gameData[currentChKey].sections[sk];
        const words = (sec.words || []).slice(0, 5);
        let idx = 0;
        document.getElementById('section-heading-text').innerText = sec.name;
        window.showView('word-view');
        
        const render = () => {
            if(idx >= words.length) {
                coins += 100;
                // 更新所有顯示金幣的地方
                document.querySelectorAll('.coin-display, .coin-box').forEach(el => el.innerText = "金幣: " + coins);
                document.getElementById('word-list').innerHTML = `<div class="rec-box"><h2>🎉 完成挑戰！</h2><button onclick="location.reload()" class="rec-btn">返回</button></div>`;
                return;
            }
            const w = words[idx];
            document.getElementById('word-list').innerHTML = `
                <div class="rec-box">
                    <div style="font-size:3rem; font-weight:bold;">${w.parts.map(p => `<span class="c-${p.ty}">${p.t}</span>`).join('')}</div>
                    <div style="font-size:1.5rem; color:#666; margin:20px 0;">${w.a}</div>
                    <button id="rec-btn" class="rec-btn">按住錄音</button>
                    <p>(${idx+1}/5)</p>
                </div>`;
            document.getElementById('rec-btn').onmousedown = async () => {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const recorder = new MediaRecorder(stream);
                recorder.start();
                document.getElementById('rec-btn').onmouseup = () => { recorder.stop(); idx++; render(); };
            };
        };
        render();
    };

    async function loadData() {
        const docSnap = await getDoc(doc(db, "gameConfig", "content"));
        if (docSnap.exists()) {
            gameData = docSnap.data();
            document.getElementById('main-menu').innerHTML = Object.keys(chapterNames).map(k => 
                `<div class="menu-card" onclick="window.route('${k}')"><img src="images/${k}.png"></div>`
            ).join('');
        }
    }
    loadData();
</script>
</body>
</html>
