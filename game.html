<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Phonics V17.5</title>
    <style>
        :root { --primary: #651caa; --bg: #f8fafc; }
        body { margin: 0; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .main-logo-container { width: 100%; line-height: 0; cursor: pointer; }
        .header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; background: white; }
        .img-btn { height: 40px; cursor: pointer; }
        .top-bar { display: flex; justify-content: space-between; padding: 10px 20px; font-weight: bold; color: var(--primary); border-bottom: 1px solid #eee; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .menu-card { border: 2px solid #e2e8f0; border-radius: 20px; cursor: pointer; overflow: hidden; }
        .menu-card img { width: 100%; display: block; }

        /* 顏色與陰影底線規則 */
        .c-1 { color: #000; } .c-2 { color: #007bff; } .c-3 { color: #ff8800; } .c-4 { color: #28a745; } .c-5 { color: #9333ea; }
        .u-line { box-shadow: 0 4px 0 0 currentColor; }

        /* 中文在上面，英文在下面 */
        .word-display-box { height: 80px; display: flex; justify-content: center; align-items: baseline; margin: 10px 20px 0 20px; }
        .word-text { font-size: 3rem; font-weight: bold; display: flex; align-items: baseline; }
        .word-translation { font-size: 1.6rem; color: #333; margin-top: 20px; font-weight: bold; }
        
        .rec-btn { padding: 20px 40px; font-size: 1.2rem; background: var(--primary); color: white; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .rec-btn.recording { background: #dc2626; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="home-view">
        <div class="main-logo-container" onclick="window.location.reload()"><img src="images/title_logo_2.png" style="width:100%"></div>
        <div class="top-bar"><span>⭐ 我的收藏</span><span class="coin-display">金幣: 100</span></div>
        <div id="main-menu" class="menu-grid">
            <div class="menu-card" onclick="window.route('ch1')"><img src="images/ch1.png"></div>
            <div class="menu-card" onclick="window.route('ch2')"><img src="images/ch2.png"></div>
            <div class="menu-card" onclick="window.route('ch3')"><img src="images/ch3.png"></div>
            <div class="menu-card" onclick="window.route('ch4')"><img src="images/ch4.png"></div>
            <div class="menu-card" onclick="window.route('ch5')"><img src="images/ch5.png"></div>
            <div class="menu-card" onclick="window.route('ch6')"><img src="images/ch6.png"></div>
            <div class="menu-card" onclick="window.route('ch7')"><img src="images/ch7.png"></div>
            <div class="menu-card" onclick="window.route('ch8')"><img src="images/ch8.png"></div>
        </div>
    </div>
    
    <div id="section-view" class="hidden">
        <div class="header">
            <img src="images/back_btn.png" class="img-btn" onclick="window.showView('home-view')">
            <div id="chapter-heading-text" style="font-weight:bold;"></div>
            <div class="coin-display">金幣: 100</div>
        </div>
        <div id="section-list" class="menu-grid">載入中...</div>
    </div>

    <div id="word-view" class="hidden">
        <div class="header">
            <img src="images/back_btn.png" class="img-btn" onclick="window.showView('section-view')">
            <div id="section-heading-text" style="font-weight:bold;"></div>
            <div class="coin-display">金幣: 100</div>
        </div>
        <div id="word-list" style="text-align:center; padding:20px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const db = getFirestore(initializeApp({ projectId: "phonics-b096f" }));
    const chapterNames = { ch1: "1 認識自己", ch2: "2 家居空間", ch3: "3 美食天地", ch4: "4 日常生活", ch5: "5 城鄉見聞", ch6: "6 樂在其中", ch7: "7 好好學習", ch8: "8 綠色地球" };
    let gameData = null, currentChKey = "", coins = 100, isRecording = false, recorder = null, stream = null;

    window.showView = (id) => { document.querySelectorAll('.app-container > div').forEach(d => d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); };
    function updateUI() { document.querySelectorAll('.coin-display').forEach(el => el.innerText = "金幣: " + coins); }

    window.route = async (k) => { 
        currentChKey = k; 
        document.getElementById('chapter-heading-text').innerText = chapterNames[k];
        if(!gameData) { const snap = await getDoc(doc(db, "gameConfig", "content")); gameData = snap.data(); }
        document.getElementById('section-list').innerHTML = Object.keys(gameData[k].sections).sort().map(sk => 
            `<div onclick="window.openSection('${sk}')"><img src="images/${k}_s${sk.replace(/\D/g,'').padStart(2,'0')}.png" style="width:100%; border-radius:15px;"></div>`
        ).join(''); 
        window.showView('section-view'); 
    };

    window.openSection = (sk) => {
        const sec = gameData[currentChKey].sections[sk];
        const words = (sec.words || []).slice(0, 5);
        let idx = 0;
        document.getElementById('section-heading-text').innerText = sec.name;
        window.showView('word-view');
        
        const render = () => {
            if(idx >= words.length) {
                document.getElementById('word-list').innerHTML = `<h2>🎉 挑戰完成！</h2><p>獲得 100 金幣！</p><button class="rec-btn" onclick="location.reload()">返回首頁</button>`;
                return;
            }
            const w = words[idx];
            const wordHTML = w.parts.map(p => `<span class="c-${p.ty || 1} ${(p.u === 1) ? 'u-line' : ''}">${p.t}</span>`).join('');
            
            document.getElementById('word-list').innerHTML = `
                <div class="word-translation">${w.a}</div>
                <div class="word-display-box">
                    <div class="word-text">${wordHTML}</div>
                </div>
                <button id="rec-btn" class="rec-btn">按一下開始錄音</button>
                <p style="color:#666; margin-top:20px;">(${idx+1}/5)</p>
            `;
            
            const btn = document.getElementById('rec-btn');
            btn.onclick = async () => {
                if (!isRecording) {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        recorder = new MediaRecorder(stream);
                        recorder.start();
                        isRecording = true;
                        btn.innerText = "錄音中... (按一下停止)";
                        btn.classList.add('recording');
                    } catch(e) { alert("無法取得麥克風權限"); }
                } else {
                    recorder.stop();
                    stream.getTracks().forEach(t => t.stop());
                    isRecording = false;
                    coins += 20;
                    updateUI();
                    idx++;
                    render();
                }
            };
        };
        render();
    };
</script>
</body>
</html>
