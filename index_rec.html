<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Phonics V15.5 - Speech Feedback</title>
    <style>
        :root { --primary: #651caa; --bg: #f8fafc; --text: #1e293b; --accent: #f59e0b; }
        body { margin: 0; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; position: sticky; top: 0; background: white; z-index: 100; min-height: 65px; box-sizing: border-box; }
        .back-area, .play-area { width: 80px; display: flex; }
        .back-area { justify-content: flex-start; }
        .play-area { justify-content: flex-end; }
        .img-btn { height: 40px !important; width: auto !important; cursor: pointer; object-fit: contain; }
        .heading-area { flex: 1; display: flex; justify-content: center; align-items: center; text-align: center; }
        .heading-text { font-size: 1.3rem; font-weight: bold; color: #4b0082; line-height: 1.2; }
        .main-logo-container { width: 100%; padding: 0; line-height: 0; margin: 0; cursor: pointer; display: block; }
        .main-logo { width: 100%; height: auto; display: block; }
        .c-1 { color: #000000 !important; } .c-2 { color: #007bff !important; } .c-3 { color: #ff8800 !important; } .c-4 { color: #28a745 !important; } .c-5 { color: #9333ea !important; } .c-6 { color: #7a3a12 !important; } .u { text-decoration: underline !important; text-underline-offset: 4px; text-decoration-thickness: 3px; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .menu-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; height: auto; }
        .menu-card img { width: 100%; height: auto; display: block; object-fit: contain; }

        .section-box { padding: 15px; border-bottom: 1px solid #f1f5f9; }
        .inline-word-list { font-size: 1.5rem !important; line-height: 2.3 !important; font-weight: bold !important; }
        .word-item { cursor: pointer; display: inline-block; padding: 0 10px; color: #1e293b; font-weight: bold !important; border-radius: 8px; border: 2px solid transparent; transition: 0.3s; }
        .word-mean { color: #444; font-size: 1.1rem; font-weight: normal; margin-left: 4px; vertical-align: middle; }
        
        /* 狀態顏色 */
        .highlight-text { background: #ebf2ff; border-color: #1fb338; }
        .speech-listening { background: #fffbeb; border-color: #f59e0b; animation: pulse 1s infinite; }
        .speech-correct { background: #ecfdf5; border-color: #10b981; color: #065f46 !important; }
        .speech-wrong { background: #fef2f2; border-color: #ef4444; color: #991b1b !important; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .section-grid-double { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .btn-card-img { width: 100%; height: auto; display: block; border-radius: 15px; cursor: pointer; border: 1px solid #f1f5f9; }
        .word-container { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; justify-content: space-between; }
        .word-card { flex: 1 1 calc(50% - 8px); min-width: 150px; border-radius: 15px; cursor: pointer; padding: 8px 5px; background: white; border: 2px solid #e2e8f0; text-align: center; transition: 0.3s; } 
        .card-q { font-size: 1.8rem; font-weight: bold; }
        .card-a { font-size: 1.1rem; color: #64748b; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: white; border-radius: 20px; padding: 25px; width: 420px; max-height: 85vh; overflow-y: auto; }
        
        .setting-panel { margin-top: 20px; padding: 15px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .setting-label { font-size: 0.95rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="home-view">
        <div class="main-logo-container" onclick="window.toggleModal(true)"><img src="images/title_logo.png" class="main-logo"></div>
        <div id="main-menu" class="menu-grid"></div>
    </div>
    <div id="special-view" class="hidden">
        <div class="header">
            <div class="back-area"><img src="images/back_btn.png" class="img-btn" onclick="window.showView('home-view')"></div>
            <div class="heading-area"><div id="special-heading-text" class="heading-text"></div></div>
            <div class="play-area"><img id="special-play-all-img" src="images/play_all.png" class="img-btn"></div>
        </div>
        <div id="special-content"></div>
    </div>
    <div id="section-view" class="hidden">
        <div class="header">
            <div class="back-area"><img src="images/back_btn.png" class="img-btn" onclick="window.showView('home-view')"></div>
            <div class="heading-area"><div id="chapter-heading-text" class="heading-text"></div></div>
            <div class="play-area"></div>
        </div>
        <div id="section-list" class="section-grid-double"></div>
    </div>
    <div id="word-view" class="hidden">
        <div class="header">
            <div class="back-area"><img src="images/back_btn.png" class="img-btn" onclick="window.showView('section-view')"></div>
            <div class="heading-area"><div id="section-heading-text" class="heading-text"></div></div>
            <div class="play-area"><img id="word-play-all-img" src="images/play_all.png" class="img-btn"></div>
        </div>
        <div id="word-list" class="word-container"></div>
    </div>
</div>

<div id="intro-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h3 id="intro-title" style="text-align: center; color: var(--primary);">簡介及設定</h3>
        <p>掌握 Phonics，建立「見字能讀」的自信。</p>
        <div class="setting-panel">
            <div class="setting-row">
                <span class="setting-label">連續播放次數：</span>
                <select id="repeat-select" style="padding:4px;">
                    <option value="1">1次</option>
                    <option value="2" selected>2次</option>
                    <option value="3">3次</option>
                </select>
            </div>
            <div class="setting-row">
                <span class="setting-label">語音評分模式：</span>
                <input type="checkbox" id="eval-mode" style="width:20px; height:20px;">
            </div>
            <p style="font-size:0.8rem; color:#64748b; margin:0;">* 開啟後，點選單字會自動聽你讀音並比對。</p>
        </div>
        <button style="width:100%; margin-top:20px; padding:12px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold;" onclick="window.toggleModal(false)">開始學習</button>
        <button id="sync-btn" style="width:100%; margin-top:10px; padding:12px; background:#1e293b; color:white; border:none; border-radius:10px; font-weight:bold;" class="hidden" onclick="window.syncToFirebase()">同步數據</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBGKgeo-BHkTO4cG8qMcCJiFenOjmQL494", 
        authDomain: "phonics-b096f.firebaseapp.com", 
        projectId: "phonics-b096f", 
        storageBucket: "phonics-b096f.firebasestorage.app", 
        messagingSenderId: "315671176929", 
        appId: "1:315671176929:web:9c525f86c381b6b0c179a0" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const chapterNames = {
        ch_a: "Short Vowels (CVC)", ch_b: "Digraphs & Blends", ch_c: "Vowel Digraphs & Long Vowels", ch_d: "Silent Letters & Special Sound",
        ch1: "1 認識自己 About Me", ch2: "2 家居空間 Home Space", ch3: "3 美食天地 Food World", ch4: "4 日常生活 Daily Life",
        ch5: "5 Town & Country", ch6: "6 Have Fun", ch7: "7 Let's Learn", ch8: "8 Green Earth"
    };

    let gameData = {};
    let wordsAll = []; 
    let currentChKey = ""; 
    let currentAbortController = null;
    let repeatCount = 2;
    let isEvalMode = false;

    // 語音辨識初始化
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if (recognition) {
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
    }

    document.getElementById('repeat-select').addEventListener('change', (e) => repeatCount = parseInt(e.target.value));
    document.getElementById('eval-mode').addEventListener('change', (e) => isEvalMode = e.target.checked);

    window.toggleModal = (show) => { document.getElementById('intro-modal').classList.toggle('hidden', !show); };
    window.showView = (id) => { 
        if (currentAbortController) { currentAbortController.abort = true; currentAbortController = null; }
        document.querySelectorAll('.app-container > div').forEach(d => { if(!d.classList.contains('modal-overlay')) d.classList.add('hidden'); });
        document.getElementById(id).classList.remove('hidden'); 
    };

    window.route = (k) => { 
        currentChKey = k;
        if (['ch_a','ch_b','ch_c','ch_d'].includes(k)) window.renderSpecial(k);
        else window.renderChapterList(k);
    };

    window.handleWordClick = async (word, elementId) => {
        window.speak(word);
        if (!isEvalMode || !recognition) return;

        const el = document.getElementById(elementId);
        el.classList.add('speech-listening');

        // 等待播放完畢後開始聽
        setTimeout(() => {
            recognition.start();
            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript.toLowerCase().trim();
                const target = word.toLowerCase().trim();
                
                el.classList.remove('speech-listening');
                if (speechResult === target) {
                    el.classList.add('speech-correct');
                    setTimeout(() => el.classList.remove('speech-correct'), 2000);
                } else {
                    el.classList.add('speech-wrong');
                    setTimeout(() => el.classList.remove('speech-wrong'), 2000);
                }
            };
            recognition.onerror = () => el.classList.remove('speech-listening');
            recognition.onspeechend = () => recognition.stop();
        }, 1000);
    };

    window.renderSpecial = (k) => {
        const item = gameData[k] || { sections: [] };
        wordsAll = []; 
        let globalIdx = 0;
        document.getElementById('special-heading-text').innerText = chapterNames[k];
        const contentHtml = (item.sections || []).map(sec => {
            const startIdx = globalIdx;
            let ws = (sec.words || []).map(w => {
                const idx = globalIdx++;
                wordsAll.push(w);
                let displayText = w.parts ? w.parts.map(p => `<span class="c-${p.ty} ${p.u ? 'u' : ''}">${p.t}</span>`).join('') : (w.p || w.q);
                return `<span class="word-item" id="sp-${idx}" onclick="window.handleWordClick('${w.q}', 'sp-${idx}')">${displayText}<span class="word-mean">${w.a}</span></span>`;
            }).join(' ');
            return `<div class="section-box"><span style="color:#ad4f26; font-size:1.3rem; font-weight:bold; cursor:pointer;" onclick="window.playSection(${startIdx}, ${globalIdx})">${sec.name}</span><div class="inline-word-list">${ws}</div></div>`;
        }).join('');
        document.getElementById('special-content').innerHTML = contentHtml;
        document.getElementById('special-play-all-img').onclick = function() { window.playAll(this, wordsAll, 'sp', 'highlight-text'); };
        window.showView('special-view');
    };

    window.renderChapterList = (k) => {
        const item = gameData[k] || {sections:{}};
        document.getElementById('chapter-heading-text').innerText = chapterNames[k];
        const listHtml = Object.keys(item.sections || {}).sort().map(sk => {
            let skImg = 's' + sk.replace(/[^0-9]/g, '').padStart(2, '0');
            return `<div onclick="window.openSection('${sk}')"><img src="images/${k}_${skImg}.png" class="btn-card-img" onerror="this.src='images/placeholder.png'"></div>`;
        }).join('');
        document.getElementById('section-list').innerHTML = listHtml;
        window.showView('section-view');
    };

    window.openSection = (sk) => {
        const sec = gameData[currentChKey].sections[sk];
        document.getElementById('section-heading-text').innerText = sec.name;
        document.getElementById('word-list').innerHTML = (sec.words || []).map((w, i) => {
            let h = w.parts ? w.parts.map(p => `<span class="c-${p.ty} ${p.u ? 'u' : ''}">${p.t}</span>`).join('') : w.q;
            return `<div id="card-${i}" class="word-card" onclick="window.handleWordClick('${w.q}', 'card-${i}')"><div class="card-q">${h}</div><div class="card-a">${w.a}</div></div>`;
        }).join('');
        document.getElementById('word-play-all-img').onclick = function() { window.playAll(this, sec.words, 'card', 'highlight-card'); };
        window.showView('word-view');
    };

    window.speak = (t) => {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'en-US';
        m.rate = 0.85;
        window.speechSynthesis.speak(m);
    };

    window.playAll = async (btn, words, prefix, highlightClass) => {
        if (currentAbortController) { currentAbortController.abort = true; currentAbortController = null; btn.src = "images/play_all.png"; window.speechSynthesis.cancel(); return; }
        const ctrl = { abort: false }; currentAbortController = ctrl; btn.src = "images/stop_btn.png"; 
        for (let i = 0; i < words.length; i++) {
            if (ctrl.abort) break;
            const el = document.getElementById(`${prefix}-${i}`);
            if (el) el.classList.add(highlightClass); 
            for (let r = 0; r < repeatCount; r++) {
                if (ctrl.abort) break;
                window.speak(words[i].q);
                await new Promise(res => setTimeout(res, 1600));
            }
            if (el) el.classList.remove(highlightClass);
        }
        btn.src = "images/play_all.png"; currentAbortController = null;
    };

    window.playSection = async (start, end) => {
        if (currentAbortController) { currentAbortController.abort = true; currentAbortController = null; window.speechSynthesis.cancel(); return; }
        const ctrl = { abort: false }; currentAbortController = ctrl;
        for (let i = start; i < end; i++) {
            if (ctrl.abort) break;
            const el = document.getElementById(`sp-${i}`);
            if (el) el.classList.add('highlight-text');
            for (let r = 0; r < repeatCount; r++) {
                if (ctrl.abort) break;
                window.speak(wordsAll[i].q);
                await new Promise(res => setTimeout(res, 1600));
            }
            if (el) el.classList.remove('highlight-text');
        }
        currentAbortController = null;
    };

    async function loadData() {
        try {
            const docSnap = await getDoc(doc(db, "gameConfig", "content"));
            if (docSnap.exists()) { gameData = docSnap.data(); renderHome(); }
            else renderHome();
        } catch (e) { renderHome(); }
    }

    function renderHome() {
        const menu = document.getElementById('main-menu');
        menu.innerHTML = Object.keys(chapterNames).map(k => {
            const cls = (['ch_a','ch_b','ch_c','ch_d'].includes(k)) ? 'small-icon' : 'chapter-icon';
            return `<div class="menu-card ${cls}" onclick="window.route('${k}')"><img src="images/${k}.png" onerror="this.src='images/placeholder.png'"></div>`;
        }).join('');
    }

    loadData();
</script>

</body>
</html>
