<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Phonics V15.7 - Mobile Pro</title>
    <style>
        :root { --primary: #651caa; --bg: #f8fafc; --text: #1e293b; --accent: #f59e0b; }
        body { margin: 0; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; justify-content: center; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; }
        .hidden { display: none !important; }
        
        /* 頁面標題與佈局 */
        .header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; position: sticky; top: 0; background: white; z-index: 100; min-height: 65px; box-sizing: border-box; }
        .back-area, .play-area { width: 80px; display: flex; }
        .img-btn { height: 40px !important; cursor: pointer; object-fit: contain; }
        .heading-text { font-size: 1.2rem; font-weight: bold; color: #4b0082; text-align: center; }

        /* 單字顯示 */
        .section-box { padding: 15px; border-bottom: 1px solid #f1f5f9; }
        .word-item { cursor: pointer; display: inline-block; padding: 5px 10px; margin: 5px; color: #1e293b; font-weight: bold; border-radius: 10px; border: 2px solid transparent; font-size: 1.6rem; transition: background 0.2s; }
        .word-mean { color: #64748b; font-size: 1.1rem; font-weight: normal; margin-left: 4px; }
        .c-1 { color: #000; } .c-2 { color: #007bff; } .c-3 { color: #ff8800; } .c-4 { color: #28a745; } .u { text-decoration: underline; }

        /* 手機強化：全螢幕反饋層 (核心修改) */
        #mobile-feedback {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; /* 確保在最頂層 */
            pointer-events: none; /* 不影響點擊 */
        }
        .fb-overlay-green { background: rgba(16, 185, 129, 0.9); display: flex !important; }
        .fb-overlay-red { background: rgba(239, 68, 68, 0.9); display: flex !important; }
        .fb-big-icon { font-size: 120px; color: white; margin-bottom: 20px; }
        .fb-big-text { font-size: 2.5rem; color: white; font-weight: bold; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }

        /* 正在聽音的狀態 */
        .listening-glow { background: #fffbeb !important; border: 2px solid #f59e0b !important; box-shadow: 0 0 15px #f59e0b; }

        /* 選單與設定 */
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .menu-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 20px; overflow: hidden; cursor: pointer; }
        .menu-card img { width: 100%; height: auto; display: block; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: white; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; box-sizing: border-box; }
        .setting-panel { margin: 15px 0; padding: 15px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="mobile-feedback">
        <div id="m-icon" class="fb-big-icon"></div>
        <div id="m-text" class="fb-big-text"></div>
    </div>

    <div id="home-view">
        <div style="cursor:pointer" onclick="window.toggleModal(true)"><img src="images/title_logo.png" style="width:100%"></div>
        <div id="main-menu" class="menu-grid"></div>
    </div>
    
    <div id="special-view" class="hidden">
        <div class="header">
            <div class="back-area"><img src="images/back_btn.png" class="img-btn" onclick="window.showView('home-view')"></div>
            <div id="special-heading-text" class="heading-text"></div>
            <div class="play-area"><img id="special-play-all-img" src="images/play_all.png" class="img-btn"></div>
        </div>
        <div id="special-content"></div>
    </div>
</div>

<div id="intro-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h3 style="text-align:center; color:var(--primary); margin-top:0;">學習及評分設定</h3>
        <div class="setting-panel">
            <div class="setting-row">
                <span>朗讀次數：</span>
                <select id="repeat-select"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
            </div>
            <div class="setting-row">
                <span>語音評分模式：</span>
                <input type="checkbox" id="eval-mode" style="width:24px; height:24px;">
            </div>
            <p style="font-size:0.85rem; color:#64748b; margin:5px 0 0 0;">* 點擊單字後請對準麥克風清晰讀出。</p>
        </div>
        <button style="width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:bold; font-size:1.1rem;" onclick="window.toggleModal(false)">確定並開始</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBGKgeo-BHkTO4cG8qMcCJiFenOjmQL494", 
        authDomain: "phonics-b096f.firebaseapp.com", 
        projectId: "phonics-b096f", 
        storageBucket: "phonics-b096f.firebasestorage.app", 
        messagingSenderId: "315671176929", 
        appId: "1:315671176929:web:9c525f86c381b6b0c179a0" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let gameData = {};
    let isEvalMode = false;
    let repeatCount = 2;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if(recognition) {
        recognition.lang = 'en-US';
        recognition.interimResults = false;
    }

    window.toggleModal = (show) => document.getElementById('intro-modal').classList.toggle('hidden', !show);
    window.showView = (id) => {
        document.querySelectorAll('.app-container > div').forEach(d => { if(d.id !== 'mobile-feedback') d.classList.add('hidden'); });
        document.getElementById(id).classList.remove('hidden');
    };

    // 強效手機反饋函數
    function triggerFeedback(isCorrect) {
        const overlay = document.getElementById('mobile-feedback');
        const icon = document.getElementById('m-icon');
        const text = document.getElementById('m-text');

        overlay.className = isCorrect ? 'fb-overlay-green' : 'fb-overlay-red';
        icon.innerHTML = isCorrect ? '✅' : '❌';
        text.innerText = isCorrect ? 'Excellent!' : 'Try Again';

        // 顯示 1.2 秒後自動隱藏
        setTimeout(() => {
            overlay.className = '';
            overlay.style.display = 'none';
        }, 1200);
    }

    window.handleWordClick = async (word, elId) => {
        window.speak(word);
        if (!isEvalMode || !recognition) return;

        const el = document.getElementById(elId);
        el.classList.add('listening-glow');

        // 朗讀約 1 秒後開啟辨識
        setTimeout(() => {
            try {
                recognition.start();
                recognition.onresult = (event) => {
                    const result = event.results[0][0].transcript.toLowerCase().trim();
                    const target = word.toLowerCase().trim();
                    el.classList.remove('listening-glow');
                    
                    if (result === target) triggerFeedback(true);
                    else triggerFeedback(false);
                };
                recognition.onerror = () => {
                    el.classList.remove('listening-glow');
                    // 如果辨識失敗也給個提示，防止畫面卡住
                };
                recognition.onspeechend = () => recognition.stop();
            } catch(e) {
                el.classList.remove('listening-glow');
            }
        }, 1200);
    };

    window.speak = (t) => {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'en-US'; m.rate = 0.8;
        window.speechSynthesis.speak(m);
    };

    // 渲染章節內容
    window.route = (k) => {
        const item = gameData[k];
        if(!item) return;
        document.getElementById('special-heading-text').innerText = k.toUpperCase();
        document.getElementById('special-content').innerHTML = item.sections.map((s, si) => `
            <div class="section-box">
                <div style="font-weight:bold; color:var(--primary); margin-bottom:5px;">${s.name}</div>
                ${s.words.map((w, wi) => {
                    const id = `w-${k}-${si}-${wi}`;
                    let h = w.parts ? w.parts.map(p => `<span class="c-${p.ty} ${p.u?'u':''}">${p.t}</span>`).join('') : w.q;
                    return `<span id="${id}" class="word-item" onclick="window.handleWordClick('${w.q}', '${id}')">${h}<span class="word-mean">${w.a}</span></span>`;
                }).join('')}
            </div>
        `).join('');
        window.showView('special-view');
    };

    document.getElementById('eval-mode').onchange = (e) => isEvalMode = e.target.checked;
    document.getElementById('repeat-select').onchange = (e) => repeatCount = parseInt(e.target.value);

    async function init() {
        const snap = await getDoc(doc(db, "gameConfig", "content"));
        if(snap.exists()) {
            gameData = snap.data();
            const menu = document.getElementById('main-menu');
            menu.innerHTML = Object.keys(gameData).map(k => `<div class="menu-card" onclick="window.route('${k}')"><img src="images/${k}.png" onerror="this.src='images/placeholder.png'"></div>`).join('');
        }
    }
    init();
</script>
</body>
</html>
