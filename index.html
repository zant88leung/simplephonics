<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Phonics V7.4 - Slim UI</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; --accent: #f59e0b; }
        body { margin: 0; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .header { padding: 30px 20px; text-align: center; border-bottom: 1px solid #eee; position: sticky; top: 0; background: white; z-index: 100; }
        .header h1 { font-size: 2.5rem; margin: 0; letter-spacing: 1px; cursor: pointer; user-select: none; }
        
        /* 簡介按鈕 */
        .intro-btn { background: #f1f5f9; color: var(--primary); border: 2px solid #e2e8f0; padding: 8px 20px; border-radius: 20px; font-size: 1rem; margin-top: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        
        /* 彈出視窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-box { background: white; border-radius: 20px; padding: 25px; max-height: 85vh; overflow-y: auto; width: 100%; max-width: 420px; line-height: 1.7; position: relative; }
        .modal-close-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; margin-top: 15px; cursor: pointer; }

        /* 選單網格 */
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        
        /* 修改：減低主頁框的高度 */
        .menu-card { 
            padding: 15px 10px; /* 原本是 25px，現在減至 15px */
            background: #fff; 
            border: 2px solid #e2e8f0; 
            border-radius: 20px; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
        }
        .menu-card.special { border-color: var(--accent); background: #fffbeb; }
        .menu-card .icon { font-size: 2.2rem; margin-bottom: 5px; } /* 略微縮小圖標 */
        .menu-card .title { font-size: 1.2rem; font-weight: bold; }

        /* CVC / Digraphs 特殊顯示樣式 */
        .section-box { padding: 15px; border-bottom: 1px solid #f1f5f9; }
        .section-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 2px solid #eee; }
        .section-name { font-size: 1.3rem; font-weight: bold; color: #334155; }
        .play-all-btn { background: var(--primary); color: white; border: none; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
        .inline-word-list { font-size: 1.5rem; line-height: 2.3; color: #475569; font-weight: bold; }
        .word-item { cursor: pointer; display: inline-block; padding: 0 8px; border-radius: 5px; }
        .word-item .meaning { font-size: 0.95rem; color: #94a3b8; margin-left: 3px; font-weight: normal; }
        .highlight { background-color: #fef9c3 !important; color: var(--accent) !important; }

        /* 詞語卡片樣式 */
        .word-container { display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; }
        .word-card { flex: 1 1 calc(33.33% - 10px); min-width: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 18px; cursor: pointer; text-align: center; padding: 15px 5px; border: 1px solid rgba(0,0,0,0.05); font-weight: bold; } 
        .card-q { font-size: 1.8rem; margin-bottom: 5px; }
        .card-a { font-size: 1rem; color: #475569; font-weight: normal; }

        /* 返回按鈕樣式 (大箭頭) */
        .back-btn { 
            position: absolute; 
            left: 10px; 
            top: 25px; 
            background: none; 
            border: none; 
            font-size: 2.5rem; 
            color: var(--primary); 
            cursor: pointer; 
            z-index: 101; 
        }

        .p1 { color: #000; font-weight: bold; } .p2 { color: #f00; font-weight: bold; } .p3 { color: #00f; font-weight: bold; }
        .c1 { background-color: #ffe4e6; } .c2 { background-color: #dcfce7; } .c3 { background-color: #fef9c3; } .c4 { background-color: #f3e8ff; } 
        .c5 { background-color: #ffedd5; } .c6 { background-color: #dbeafe; } .c7 { background-color: #fae8ff; } .c8 { background-color: #f0fdfa; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="home-view">
        <div class="header">
            <h1 onclick="adminTrigger()">Simple Phonics</h1>
            <button class="intro-btn" onclick="toggleModal(true)">📖 課程簡介 & 步驟</button>
        </div>
        <div id="main-menu" class="menu-grid"></div>
    </div>

    <div id="special-view" class="hidden">
        <div class="header">
            <button class="back-btn" onclick="showView('home-view')">⬅</button>
            <h2 id="special-title"></h2>
        </div>
        <div id="special-content"></div>
    </div>

    <div id="section-view" class="hidden">
        <div class="header">
            <button class="back-btn" onclick="showView('home-view')">⬅</button>
            <h2 id="chapter-title"></h2>
        </div>
        <div id="section-list" class="menu-grid"></div>
    </div>

    <div id="word-view" class="hidden">
        <div class="header">
            <button class="back-btn" onclick="showView('section-view')">⬅</button>
            <h2 id="section-title"></h2>
            <button id="section-play-btn" style="display:inline-block; background:var(--primary); color:white; border:none; padding:5px 12px; border-radius:15px; cursor:pointer; font-size:0.9rem; margin-left:10px; vertical-align:middle;">▶ 播放全部</button>
        </div>
        <div id="word-list" class="word-container"></div>
    </div>
</div>

<div id="intro-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h3>學習步驟</h3>
        <p>1. 學習A至Z發音。<br>2. 拼讀CVC單字。<br>3. 學習組合音Digraphs。</p>
        <button class="modal-close-btn" onclick="toggleModal(false)">關閉</button>
    </div>
</div>

<div id="admin-panel" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;padding:15px;border-radius:12px;z-index:3000;" class="hidden">
    <button style="color:white;background:#3b82f6;border:none;padding:10px 15px;border-radius:5px;cursor:pointer;font-weight:bold;" onclick="syncToFirebase()">同步資料到雲端</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBGKgeo-BHkTO4cG8qMcCJiFenOjmQL494", authDomain: "phonics-b096f.firebaseapp.com", projectId: "phonics-b096f", storageBucket: "phonics-b096f.firebasestorage.app", messagingSenderId: "315671176929", appId: "1:315671176929:web:9c525f86c381b6b0c179a0" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const sortOrder = ['cvc', 'digraphs', 'ch1', 'ch2', 'ch3', 'ch4', 'ch5', 'ch6', 'ch7', 'ch8'];
    let gameData = {}; let currentChKey = ""; let currentAbortController = null; const colors = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8'];

    async function loadData() {
        try {
            const docSnap = await getDoc(doc(db, "gameConfig", "content"));
            gameData = docSnap.exists() ? docSnap.data() : {};
            renderHome();
        } catch (e) { console.error(e); }
    }

    window.toggleModal = (show) => { document.getElementById('intro-modal').classList.toggle('hidden', !show); }
    window.syncToFirebase = async function() { try { await setDoc(doc(db, "gameConfig", "content"), gameData); alert("✅ 同步成功！"); } catch (e) { alert("❌ 同步失敗"); } }
    window.showView = (id) => { if (currentAbortController) currentAbortController.abort = true; document.querySelectorAll('.app-container > div').forEach(d => d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    
    function renderHome() { 
        const menu = document.getElementById('main-menu');
        menu.innerHTML = sortOrder.filter(key => gameData[key]).map(key => `
            <div class="menu-card ${(key === 'cvc' || key === 'digraphs') ? 'special' : ''}" onclick="route('${key}')">
                <div class="icon">${gameData[key].icon || "📖"}</div>
                <div class="title">${gameData[key].title}</div>
            </div>`).join('');
    }

    window.route = (key) => { 
        currentChKey = key; 
        if (key === 'cvc' || key === 'digraphs') { renderSpecial(key); } else { renderChapter(key); }
    }

    function renderSpecial(key) {
        const item = gameData[key]; 
        document.getElementById('special-title').innerHTML = item.title;
        document.getElementById('special-content').innerHTML = (item.sections || []).map((sec, sIdx) => {
            let wordsHtml = sec.words.map((w, wIdx) => `<span class="word-item" id="sp-${key}-${sIdx}-${wIdx}" onclick="speak('${w.q}')">${w.q}<span class="meaning">${w.a}</span></span>`).join(' ');
            return `<div class="section-box"><div class="section-title-row"><span class="section-name">${sec.name}</span><button class="play-all-btn" onclick="playAllWords(this, ${JSON.stringify(sec.words).replace(/"/g, '&quot;')}, '${key}-${sIdx}')">▶ 播放全部</button></div><div class="inline-word-list">${wordsHtml}</div></div>`;
        }).join('');
        showView('special-view');
    }

    function renderChapter(key) {
        document.getElementById('chapter-title').innerHTML = gameData[key].title;
        const sections = gameData[key].sections || {};
        const sortedKeys = Object.keys(sections).sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
        document.getElementById('section-list').innerHTML = sortedKeys.map(k => `<div class="menu-card" onclick="openSection('${k}')"><div class="title">${sections[k].name || "Section"}</div></div>`).join('');
        showView('section-view');
    }

    window.openSection = (secKey) => {
        const item = gameData[currentChKey];
        const sec = item.sections[secKey];
        document.getElementById('section-title').innerHTML = sec.name;
        const btn = document.getElementById('section-play-btn');
        btn.onclick = () => playAllWords(btn, sec.words, 'card');
        document.getElementById('word-list').innerHTML = sec.words.map((w, i) => `<div id="card-${i}" class="word-card ${colors[i % 8]}" onclick="speak('${w.q}')"><div class="card-q">${w.p || w.q}</div><div class="card-a">${w.a}</div></div>`).join('');
        showView('word-view');
    }

    window.playAllWords = async function(btn, words, typePrefix) {
        if (currentAbortController) { currentAbortController.abort = true; return; }
        const controller = { abort: false }; currentAbortController = controller; btn.innerHTML = "⏹ 停止";
        for (let i = 0; i < words.length; i++) {
            if (controller.abort) break;
            const elId = typePrefix === 'card' ? `card-${i}` : `sp-${typePrefix}-${i}`; 
            const el = document.getElementById(elId);
            if (el) el.classList.add('highlight'); 
            speak(words[i].q);
            await new Promise(r => setTimeout(r, 1600));
            if (el) el.classList.remove('highlight');
        }
        btn.innerHTML = "▶ 播放全部"; currentAbortController = null;
    }

    window.speak = (t) => { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = 'en-US'; m.rate = 0.9; window.speechSynthesis.speak(m); }
    let clicks = 0; window.adminTrigger = () => { clicks++; if(clicks>=5) document.getElementById('admin-panel').classList.remove('hidden'); }
    loadData();
</script>
</body>
</html>
